name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aiken-lang/setup-aiken@v1.0.3
        with:
          version: v1.1.19

      - run: aiken fmt --check
      - run: aiken check
      - run: aiken build
